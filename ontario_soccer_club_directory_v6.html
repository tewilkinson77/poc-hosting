D.forEach(d=>{const m=L.circleMarker([d.lat,d.lng],{radius:13,fillColor:'#ea002a',color:'#b0001f',weight:2,opacity:1,fillOpacity:.85}).addTo(dL);m.bindPopup('<div style="min-width:200px;font-family:Roboto,sans-serif"><h3 style="color:#ea002a;margin:0 0 5px;font-size:14px;font-family:Barlow Condensed,sans-serif;text-transform:uppercase;letter-spacing:.5px">'+d.name+'</h3><p style="margin:0 0 3px;font-size:12px"><b>City:</b> '+d.city+'</p><p style="margin:0 0 3px;font-size:12px"><b>Type:</b> District Association</p><a href="https://'+d.web+'" target="_blank" style="color:#ea002a;font-size:12px">'+d.web+'</a></div>');dM[d.name]=m});
C.forEach((c,i)=>{const col=DC[c.dg]||'#9E9E9E';const m=L.marker([Number(c.lat),Number(c.lng)],{icon:pinIcon(col),title:c.n,keyboard:true}).addTo(cL);
let p='<div style="min-width:220px;font-family:Roboto,sans-serif"><h3 style="color:#231f20;margin:0 0 5px;font-size:13px;font-family:Barlow Condensed,sans-serif;text-transform:uppercase;letter-spacing:.3px">'+c.n+'</h3>';
if(c.a)p+='<p style="margin:0 0 3px;font-size:11px;color:#555"><b>Address:</b> '+c.a+'</p>';
if(c.w){let u=c.w;if(!u.startsWith('http'))u='https://'+u;p+='<p style="margin:0 0 3px;font-size:11px"><b>Website:</b> <a href="'+u+'" target="_blank" style="color:#ea002a">'+c.w+'</a></p>';}
p+='<p style="margin:0 0 3px;font-size:11px"><b>District:</b> '+c.d+'</p>';
p+='<p style="margin:4px 0 0;font-size:11px"><span style="display:inline-block;width:9px;height:9px;transform:rotate(45deg);border-radius:50% 50% 50% 0;background:'+col+';margin-right:4px;vertical-align:middle;border:1px solid rgba(0,0,0,.12)"></span><b>'+c.dg+'</b></p></div>';
m.bindPopup(p);cM[c.n+'_'+i]=m});
L.control.layers(null,{"District Associations":dL,"Member Clubs":cL},{collapsed:false}).addTo(map);
const legend=L.control({position:'bottomright'});legend.onAdd=function(){const d=L.DomUtil.create('div','legend');d.innerHTML='<h4>Club Designation</h4><div><i style="background:#ea002a"></i> District Association</div><div><i style="background:#D4AF37"></i> National Youth Club &amp; OPDL</div><div><i style="background:#1565C0"></i> Member Association - Level 2</div><div><i style="background:#F57C00"></i> Member Association - Level 1</div><div><i style="background:#4CAF50"></i> Quality Soccer Provider</div><div><i style="background:#9E9E9E"></i> Unknown</div>';return d};legend.addTo(map);
const cl=document.getElementById('cl'),si=document.getElementById('si'),df=document.getElementById('df'),dlf=document.getElementById('dlf');
const uD=[...new Set(C.map(c=>c.d))].sort();
uD.forEach(d=>{const o=document.createElement('option');o.value=d;const cnt=C.filter(c=>c.d===d).length;o.textContent=d+' ('+cnt+')';df.appendChild(o)});
function render(ft,fd,fl){cl.innerHTML='';const f=(ft||'').toLowerCase(),g={};
C.forEach((c,i)=>{if(fd&&c.d!==fd)return;if(fl&&c.dg!==fl)return;if(f&&!c.n.toLowerCase().includes(f)&&!c.d.toLowerCase().includes(f)&&!c.c.toLowerCase().includes(f)&&!c.dg.toLowerCase().includes(f))return;if(!g[c.d])g[c.d]=[];g[c.d].push({...c,idx:i})});
let has=false;const allN=Object.keys(g).sort();
allN.forEach(dn=>{has=true;const gr=document.createElement('div');gr.className='district-group';const dc=g[dn]||[];
const h=document.createElement('div');h.className='district-group-header';h.innerHTML='<span>'+dn+'</span><span class="badge">'+dc.length+'</span>';
h.addEventListener('click',()=>{const dObj=D.find(d=>d.name===dn);if(dObj){map.setView([dObj.lat,dObj.lng],10);dM[dn]?.openPopup()}});
gr.appendChild(h);
dc.forEach(c=>{const col=DC[c.dg]||'#9E9E9E';const it=document.createElement('div');it.className='club-item';
it.innerHTML='<span class="dot" style="background:'+col+'"></span><span class="cn" title="'+c.n+'">'+c.n+'</span><span class="cc">'+c.c+'</span>';
it.addEventListener('click',()=>{map.setView([c.lat,c.lng],14);cM[c.n+'_'+c.idx]?.openPopup()});
gr.appendChild(it)});cl.appendChild(gr)});
if(!has)cl.innerHTML='<div class="no-results">No clubs found matching your search.</div>'}
render('','','');
si.addEventListener('input',()=>render(si.value,df.value,dlf.value));
df.addEventListener('change',()=>{render(si.value,df.value,dlf.value);const fd=df.value;if(fd){const d=D.find(x=>x.name===fd);if(d)map.setView([d.lat,d.lng],10)}else map.setView([44.0,-80.0],6)});
dlf.addEventListener('change',()=>render(si.value,df.value,dlf.value));
</script>
</body></html>
