var desigConfig={
  Professional:{color:'#8E24AA',radius:9,border:'#fff',weight:2.5},
  OPDL:{color:'#D4AF37',radius:6,border:'#fff',weight:1},
  MA2:{color:'#1565C0',radius:6,border:'#fff',weight:1},
  MA1:{color:'#F57C00',radius:6,border:'#fff',weight:1},
  QSP:{color:'#4CAF50',radius:6,border:'#fff',weight:1},
  Unknown:{color:'#9E9E9E',radius:6,border:'#fff',weight:1}
};
var desigLabels={Professional:'Professional',OPDL:'OPDL',MA2:'MA2',MA1:'MA1',QSP:'QSP',Unknown:'Club (Unlicensed)'};

var layers={};
Object.keys(desigConfig).forEach(function(k){layers[k]=L.layerGroup().addTo(map);});
var allMarkers=[];

clubsData.forEach(function(c){
  if(!c.lat||!c.lng) return;
  var cfg=desigConfig[c.designation]||desigConfig.Unknown;
  var marker=L.circleMarker([c.lat,c.lng],{
    radius:cfg.radius,color:cfg.border,weight:cfg.weight,
    fillColor:cfg.color,fillOpacity:0.85
  });
  var p='<div style="min-width:220px;font-family:Segoe UI,Arial">';
  p+='<b style="font-size:14px;color:#006838">'+c.name+'</b><br>';
  p+='<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;color:#fff;background:'+cfg.color+';margin:4px 0">'+c.designation+'</span><br>';
  p+='<b>District:</b> '+c.district+'<br>';
  if(c.address) p+='<b>Address:</b> '+c.address+'<br>';
  if(c.phone) p+='<b>Phone:</b> '+c.phone+'<br>';
  if(c.email) p+='<b>Email:</b> <a href="mailto:'+c.email+'">'+c.email+'</a><br>';
  if(c.website){
    var url=c.website.startsWith('http')?c.website:'https://'+c.website;
    p+='<b>Website:</b> <a href="'+url+'" target="_blank">'+c.website+'</a>';
  }
  p+='</div>';
  marker.bindPopup(p);
  marker.clubData=c;
  marker.addTo(layers[c.designation]||layers.Unknown);
  allMarkers.push(marker);
});

var overlays={};
Object.keys(desigConfig).forEach(function(k){
  overlays[desigLabels[k]+' ('+layers[k].getLayers().length+')']=layers[k];
});
L.control.layers(null,overlays,{collapsed:false,position:'topleft'}).addTo(map);

var countEl=document.getElementById('club-count');
countEl.textContent=allMarkers.length+' clubs shown';
document.getElementById('searchInput').addEventListener('input',function(e){
  var q=e.target.value.toLowerCase();
  var shown=0;
  allMarkers.forEach(function(m){
    var match=m.clubData.name.toLowerCase().indexOf(q)!==-1||
              m.clubData.city.toLowerCase().indexOf(q)!==-1||
              m.clubData.district.toLowerCase().indexOf(q)!==-1;
    if(match){
      m.setStyle({opacity:1,fillOpacity:0.85});
      m.setRadius((desigConfig[m.clubData.designation]||desigConfig.Unknown).radius);
      shown++;
    } else {
      m.setStyle({opacity:0.08,fillOpacity:0.08});
      m.setRadius(2);
    }
  });
  countEl.textContent=shown+' of '+allMarkers.length+' clubs shown';
  if(!q){
    allMarkers.forEach(function(m){
      var cfg=desigConfig[m.clubData.designation]||desigConfig.Unknown;
      m.setStyle({opacity:1,fillOpacity:0.85});
      m.setRadius(cfg.radius);
    });
    countEl.textContent=allMarkers.length+' clubs shown';
  }
});
<\/script>
